name: Gerar NT Remote Pro EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Baixar executavel oficial RustDesk 1.5.3 Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/rustdesk/rustdesk/releases/download/1.5.3/rustdesk-1.5.3-x86_64.exe'
          Invoke-WebRequest -Uri $url -OutFile 'NT_Remote_Pro.exe'
          if ((Get-Item 'NT_Remote_Pro.exe').Length -lt 10000000) { throw 'Download incompleto' }
      - name: Publicar executavel
        uses: actions/upload-artifact@v4
        with:
          name: NT_Remote_Pro_Windows_x64
          path: NT_Remote_Pro.exe
          if-no-files-found: error
